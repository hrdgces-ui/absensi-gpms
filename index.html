<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Nama Singkat Saat Dijadikan Pintasan di Layar HP -->
  <title>GPMS V1.0</title>
  <meta name="application-name" content="GPMS V1.0">
  <meta name="apple-mobile-web-app-title" content="GPMS V1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <!-- Ikon Pintasan Layar Utama (Mengambil GPMS.jpeg) -->
  <link id="appFavicon" rel="icon" type="image/jpeg" href="GPMS.jpeg">
  <link id="appAppleIcon" rel="apple-touch-icon" href="GPMS.jpeg">
  <link id="appShortcutIcon" rel="shortcut icon" type="image/jpeg" href="GPMS.jpeg">

  <!-- Script Otomatis Pembuat Ikon Kotak 512x512 & Manifest Agar Logo Tidak Gepeng -->
  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Background hitam-biru gelap elegan dengan sudut membulat
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 512, 512);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        // Pasang gambar GPMS.jpeg tepat di tengah kotak 512x512 agar proporsional
        const scale = Math.min(470 / img.width, 470 / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
        terapkanIkonDanManifest(canvas.toDataURL('image/png'));
      };
      img.onerror = function() {
        // Cadangan otomatis jika GPMS.jpeg belum termuat
        ctx.fillStyle = '#fff200';
        ctx.beginPath(); ctx.arc(135, 256, 105, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0019a8';
        ctx.fillRect(190, 196, 280, 120);
        ctx.fillStyle = '#fff200';
        ctx.font = 'bold 115px Arial';
        ctx.fillText('pms', 215, 292);
        terapkanIkonDanManifest(canvas.toDataURL('image/png'));
      };
      img.src = 'GPMS.jpeg';

      function terapkanIkonDanManifest(iconDataUrl) {
        document.getElementById('appFavicon').href = iconDataUrl;
        document.getElementById('appAppleIcon').href = iconDataUrl;
        document.getElementById('appShortcutIcon').href = iconDataUrl;

        const manifest = {
          name: "GIANT PARKING MANAGEMENT SYSTEM V1.0",
          short_name: "GPMS V1.0",
          start_url: "./",
          display: "standalone",
          background_color: "#0f172a",
          theme_color: "#0f172a",
          icons: [
            { src: iconDataUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
            { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
          ]
        };
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(linkManifest);
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .shadow-card-soft { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .shadow-glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring { animation: pulseRing 3.5s infinite ease-in-out; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
