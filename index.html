<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi Kamera & GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

<div class="max-w-md mx-auto bg-white min-h-screen relative shadow-lg overflow-hidden flex flex-col">
    
    <!-- Bagian Header & Konten Utama -->
    <div class="flex-1 p-4">
        <h1 class="text-xl font-bold text-slate-800 mb-4">Sistem Absensi & Laporan</h1>
        
        <!-- Tombol untuk membuka kamera -->
        <button onclick="openTaskLiveCamera()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow transition">
            <i class="fa-solid fa-camera mr-2"></i> Buka Kamera Absensi
        </button>
    </div>

    <!-- Modal Kamera (Awalnya Tersembunyi) -->
    <div id="cameraModal" class="hidden fixed inset-0 z-50 bg-black flex flex-col max-w-md mx-auto h-full">
        
        <!-- Header Modal Kamera -->
        <div class="bg-slate-900 text-white p-3 flex justify-between items-center z-10 shrink-0">
            <span class="text-xs font-bold uppercase tracking-wider">Ambil Foto Laporan</span>
            <button type="button" onclick="closeTaskLiveCamera()" class="text-slate-400 hover:text-rose-400 p-1 transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        
        <!-- Area Preview Video -->
        <div class="relative w-full bg-black flex items-center justify-center overflow-hidden flex-1">
            <video id="cameraVideo" class="w-full h-full object-cover" autoplay playsinline></video>
            <canvas id="cameraCanvas" class="hidden"></canvas>
            
            <!-- Simulasi Watermark (Overlay saat preview) -->
            <div class="absolute bottom-2 left-2 right-2 text-white text-[10px] font-mono bg-black/50 backdrop-blur-sm p-2 rounded flex flex-col pointer-events-none">
                <span id="camWmDate" class="font-bold text-emerald-400">Loading Date...</span>
                <span id="camWmLocation">📍 Mencari koordinat GPS...</span>
                <span id="camWmUser">User: Karyawan</span>
            </div>
        </div>
        
        <!-- Kontrol Kamera Bawah -->
        <div class="bg-slate-900 p-6 flex items-center justify-center gap-8 shrink-0 pb-10">
            <button onclick="switchCamera()" class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center shadow transition active:scale-95">
                <i class="fa-solid fa-camera-rotate text-lg"></i>
            </button>
            <button onclick="capturePhoto()" class="w-20 h-20 rounded-full bg-white border-4 border-emerald-500 text-emerald-600 flex items-center justify-center shadow-lg active:scale-90 transition transform">
                <i class="fa-solid fa-camera text-3xl"></i>
            </button>
            <div class="w-12 h-12"></div> <!-- Spacer penyeimbang layout -->
        </div>
    </div>

</div>

<!-- Memanggil file JavaScript -->
<script src="app.js"></script>

</body>
</html>
